<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 25px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .gallery img:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <h1>Photo Gallery</h1>

    <div class="gallery">
        <img src="1Expert1 (1).jpg" alt="Gallery Image">
        <img src="1Expert1 (2).jpg" alt="Gallery Image">
        <img src="1Expert1 (3).jpg" alt="Gallery Image">
        <img src="1Expert1 (4).jpg" alt="Gallery Image">
        <img src="1Expert2 (1).jpg" alt="Gallery Image">
        <img src="1Expert2 (2).jpg" alt="Gallery Image">
        <img src="1Expert3 (1).jpg" alt="Gallery Image">
        <img src="p1Expert3 (2).jpg" alt="Gallery Image">
        <img src="1Experts.jpg" alt="Gallery Image">
        <img src="tester1.jpg" alt="Gallery Image">
        <img src="tester2.jpg" alt="Gallery Image">
        <img src="tester3.jpg" alt="Gallery Image">
        <img src="tester4.jpg" alt="Gallery Image">
        <img src="tester5.jpg" alt="Gallery Image">
        <img src="tester6.jpg" alt="Gallery Image">
        <img src="tester7.jpg" alt="Gallery Image">
        <img src="tester8.jpg" alt="Gallery Image">
        <img src="tester9.jpg" alt="Gallery Image">
        <img src="tester10.jpg" alt="Gallery Image">
        <img src="tester11.jpg" alt="Gallery Image">
        <img src="tester12.jpg" alt="Gallery Image">
    </div>

</body>
</html>
